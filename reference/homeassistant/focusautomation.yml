actions:
  - alias: Settle 1s from the last axis movement (restart mode resets this)
    delay:
      hours: 0
      milliseconds: 0
      minutes: 0
      seconds: 1
    note: >-
      With mode: restart, any subsequent window crossing cancels this run and
      restarts the clock, so this measures 1s from the FINAL axis arriving. Old
      automation used 3s with measured arrival ~800ms - 1s is deliberate; raise
      only with evidence of misses.
  - choose:
      - alias: Pecker - 1557/74/38
        conditions:
          - above: 1555
            below: 1559
            condition: numeric_state
            entity_id: sensor.bird_ptz_pan_position
          - above: 72
            below: 76
            condition: numeric_state
            entity_id: sensor.bird_ptz_tilt_position
          - above: 36
            below: 40
            condition: numeric_state
            entity_id: number.bird_zoom
        sequence:
