alias: Bird Focus on Arrival (PTZ position)
description: >-
  Sets per-zone camera focus when the PTZ ARRIVES at a known preset position,
  verified on all three axes (pan + tilt + zoom). Replaces the zoom-only 'Bird
  Focus on Zoom' automation (disabled 2026-08-24), which misfired because zoom
  settles before pan on long slews, so the focus write landed mid-move and
  halted the PTZ short of the preset - and because zoom alone cannot distinguish
  Platform from Finch (both zoom 37; the zoom map's Platform=39 was stale, so
  Platform arrivals were matching the Finch branch and masking that its mapped
  value 602 was wrong). ARCHITECTURE (inherited from the retired
  bird_zoom_focus_by_ptz_position, which proved it on this hardware):
  numeric_state triggers on each preset's position windows, mode: restart so any
  axis crossing a window cancels the in-flight run and restarts the settle clock
  (evaluation therefore happens 1s after the LAST axis movement, and can never
  fire mid-move), then choose branches require ALL THREE axes to match before
  writing focus. If no branch matches after the settle, nothing is written.
  SETTLE = 1s (old automation used 3s; measured preset arrival is ~800ms per its
  2026-08-11 notes, and restart-mode means the clock starts from the final
  axis's window entry, so 1s is enough margin - raise only with evidence).
  POSITIONS captured live on 2026-08-24 by touring all presets (each verified
  stable across repeated reads): Pecker 1557/74/38 -> 713. Finch 15/105/36 ->
  854. Hummer 1550/107/41 -> 287. Bath 1583/101/31 -> 992. Platform 1583/77/37
  -> 792 (re-measured 2026-08-24 via temporary auto-focus at the preset; AF
  independently settled on 785, the same value the old zoom-map bug had been
  accidentally applying, which is why Platform historically looked sharp - the
  never-validated 602 was confirmed blurry when first correctly applied).
  PlatformTop 1580/61/33 -> 960. All (Monitor wide) 1583/87/16 -> 866. All
  windows are +/-1 around the captured value. TIGHT SPOTS: PlatformTop pan
  (1579-1581) is edge-adjacent to the Bath/Platform/All cluster (1582-1584) with
  zero gap but no overlap - do not widen any pan window. Finch+Hummer share tilt
  107 (separated by pan 15 vs 1550). Pecker/Finch/Platform zoom windows overlap
  around 37-38 (separated by pan). Bath/Platform/All share pan 1583 exactly
  (separated by tilt 101/77/87). NOTE: Platform and Finch legitimately share
  focus 785 (similar focal distance, both zoom 37). NOTE: if any preset is
  re-saved on the camera, re-capture that row's pan/tilt/zoom AND reload the
  Reolink integration (HA caches the preset slot table). RE-TUNED 2026-08-30:
  all focus values re-captured live at each preset (Monitor/All wide still 866,
  pending re-tune). Finch preset re-saved on camera: now 15/105/36 (was
  15/107/37) - Finch branch tilt window now 104-106, zoom window 35-37, and a
  tilt trigger 104-106 added (new tilt 105 fell outside every existing tilt
  trigger window, so arrival could have gone undetected when tilt settled last).
  Platform and Finch no longer share zoom or focus. PECKER RE-CAPTURED
  2026-08-30: preset re-saved on camera, now 1557/74/38 (was 1567/97/38); pan
  trigger/window moved to 1556-1558 and tilt trigger/window to 73-75 (adjacent
  to Platform tilt 76-78, no overlap; pan 1556-1558 sits between Hummer
  1549-1551 and the 1579+ cluster with clear gaps).
